<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GEOFROTA | Equipe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; } .sidebar { background-color: #0f172a; border-right: 1px solid #1e293b; }</style>
</head>
<body class="flex flex-col md:flex-row">
    <aside class="w-full md:w-64 sidebar p-6 flex flex-col md:min-h-screen">
        <div class="text-2xl font-bold text-blue-500 mb-8 uppercase text-center italic">Geo<span class="text-white">Frota</span></div>
        <nav class="space-y-4 flex-1">
            <a href="index.html" class="block p-3 text-slate-400 hover:bg-slate-800 rounded-xl transition font-medium">Dashboard</a>
            <a href="operacional.html" class="block p-3 text-slate-400 hover:bg-slate-800 rounded-xl transition font-medium">Operacional</a>
            <a href="usuarios.html" class="block p-3 bg-blue-600 text-white rounded-xl font-bold uppercase text-[10px] tracking-widest">Usuários</a>
            <button onclick="logout()" class="flex items-center p-3 text-red-500 mt-10 hover:bg-red-500/10 w-full text-left rounded-xl transition font-bold uppercase text-xs"><i class="fas fa-sign-out-alt mr-2"></i> Sair</button>
        </nav>
    </aside>
    <main class="flex-1 p-4 md:p-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <h2 class="text-2xl font-black uppercase italic tracking-tighter text-blue-400">Gestão de Efetivo</h2>
            <div class="flex flex-wrap gap-2 w-full md:w-auto">
                <input type="text" id="un" placeholder="Nome do Militar" class="flex-1 bg-slate-800 p-3 rounded-xl border border-slate-700 outline-none text-white focus:border-blue-500">
                <!-- SUBSTITUÍDO CARGO POR RE -->
                <input type="text" id="ure" placeholder="RE" class="bg-slate-800 p-3 rounded-xl border border-slate-700 outline-none text-white focus:border-blue-500 w-32">
                <button onclick="addU()" class="bg-blue-600 px-6 py-3 rounded-xl font-bold hover:bg-blue-500 uppercase text-xs w-full md:w-auto">Adicionar</button>
            </div>
        </div>
        <div class="bg-slate-800 rounded-2xl overflow-x-auto shadow-2xl">
            <table class="w-full text-left text-sm min-w-[500px]">
                <thead class="bg-slate-900 text-slate-400 text-[10px] uppercase font-black tracking-widest">
                    <tr><th class="p-4">Identificação do Militar (Nome e RE)</th><th class="p-4 text-center">Ações</th></tr>
                </thead>
                <tbody id="listaU" class="divide-y divide-slate-900"></tbody>
            </table>
        </div>
    </main>
    <script>
        async function carregar() {
            const res = await fetch('/api/usuarios?t='+Date.now());
            if(res.status === 401) window.location.href = 'login.html';
            const data = await res.json();
            // EXIBINDO NOME E RE JUNTOS
            document.getElementById('listaU').innerHTML = data.map(u => `
                <tr class="hover:bg-slate-900/50 transition border-b border-slate-900">
                    <td class="p-4 uppercase font-bold text-slate-200">
                        ${u.nome} <span class="text-xs text-blue-400 ml-1">(${u.cargo || '---'})</span>
                    </td>
                    <td class="p-4 text-center">
                        <button onclick="del(${u.id})" class="text-slate-500 hover:text-red-500 transition px-4"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`).join('');
        }
        async function addU() {
            const nome=document.getElementById('un').value, re=document.getElementById('ure').value;
            if(!nome) return alert("Nome!");
            const res = await fetch('/api/usuarios', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({nome, cargo: re})});
            if(res.ok) { document.getElementById('un').value=''; document.getElementById('ure').value=''; carregar(); }
        }
        async function del(id) { if(confirm("Deseja realmente remover?")) { await fetch('/api/usuarios/'+id, {method:'DELETE'}); carregar(); } }
        async function logout() { await fetch('/api/logout', {method:'POST'}); window.location.href = 'login.html'; }
        carregar();
    </script>
</body>
</html>
