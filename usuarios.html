<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GEOFROTA | Equipe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { background-color: #0f172a; color: #f8fafc; } .sidebar { background-color: #0f172a; border-right: 1px solid #1e293b; }</style>
</head>
<body class="flex h-screen overflow-hidden">
    <aside class="w-64 sidebar flex flex-col p-6">
        <div class="text-2xl font-bold text-blue-500 mb-8 uppercase text-xs">Geo<span class="text-white">Frota</span></div>
        <nav class="space-y-4 flex-1">
            <a href="index.html" class="block p-3 text-slate-400 hover:bg-slate-800 rounded-xl transition font-medium">Dashboard</a>
            <a href="operacional.html" class="block p-3 text-slate-400 hover:bg-slate-800 rounded-xl transition font-medium">Operacional</a>
            <a href="usuarios.html" class="block p-3 bg-blue-600 text-white rounded-xl font-bold tracking-widest uppercase">Usuários</a>
            <button onclick="logout()" class="block p-3 text-red-500 mt-10 hover:bg-red-500/10 w-full text-left rounded-xl"><i class="fas fa-sign-out-alt mr-2"></i> SAIR</button>
        </nav>
    </aside>
    <main class="flex-1 p-8 overflow-y-auto">
        <div class="flex justify-between items-center mb-8"><h2 class="text-2xl font-black uppercase italic tracking-tighter">Gestão de Efetivo</h2><div class="flex gap-2"><input type="text" id="un" placeholder="Nome" class="bg-slate-800 p-3 rounded-xl border border-slate-700 outline-none focus:border-blue-500"><input type="text" id="uc" placeholder="Cargo" class="bg-slate-800 p-3 rounded-xl border border-slate-700 outline-none focus:border-blue-500"><button onclick="addU()" class="bg-blue-600 px-6 py-3 rounded-xl font-bold hover:bg-blue-500 uppercase text-xs">Adicionar</button></div></div>
        <div class="bg-slate-800 rounded-2xl overflow-hidden shadow-2xl"><table class="w-full text-left text-sm"><thead class="bg-slate-900 text-slate-400 text-[10px] uppercase font-black tracking-widest"><tr><th class="p-4">Nome</th><th class="p-4">Cargo</th><th class="p-4 text-center">Ação</th></tr></thead><tbody id="listaU" class="divide-y divide-slate-900"></tbody></table></div>
    </main>
    <script>
        async function carregar() {
            const res = await fetch('/api/usuarios?t='+Date.now());
            if(res.status === 401) window.location.href = 'login.html';
            const data = await res.json();
            document.getElementById('listaU').innerHTML = data.map(u => `<tr class="hover:bg-slate-900/50 transition"><td class="p-4 font-bold text-blue-400 uppercase">${u.nome}</td><td class="p-4 text-slate-400 uppercase text-xs">${u.cargo}</td><td class="p-4 text-center"><button onclick="del(${u.id})" class="text-slate-500 hover:text-red-500 transition"><i class="fas fa-trash"></i></button></td></tr>`).join('');
        }
        async function addU() {
            const nome=document.getElementById('un').value, cargo=document.getElementById('uc').value;
            if(!nome) return alert("Nome!");
            const res = await fetch('/api/usuarios', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({nome, cargo})});
            if(res.ok) { document.getElementById('un').value=''; document.getElementById('uc').value=''; carregar(); }
        }
        async function del(id) { if(confirm("Deletar?")) { await fetch('/api/usuarios/'+id, {method:'DELETE'}); carregar(); } }
        async function logout() { await fetch('/api/logout', {method:'POST'}); window.location.href = 'login.html'; }
        carregar();
    </script>
</body>
</html>
