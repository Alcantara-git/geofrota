<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GEOFROTA | Equipe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; } 
        .sidebar { background-color: #0f172a; border-right: 1px solid #1e293b; }
        .card { background-color: #1e293b; border: 1px solid #334155; }
        /* Estilo da Barra de Busca igual ao index.html */
        .search-input { background-color: #1e293b; border: 1px solid #334155; transition: 0.3s; }
        .search-input:focus { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.2); outline: none; }
        .text-\[9px\], .text-\[10px\], .text-\[11px\] { font-size: 0.75rem !important; line-height: 1rem !important; }
        .text-xs { font-size: 0.875rem !important; line-height: 1.25rem !important; }
        #toast { position: fixed; left: 50%; bottom: -140px; transform: translateX(-50%); width: min(92vw, 480px); padding: 16px 20px; border-radius: 16px; color: white; font-size: 0.875rem; line-height: 1.35rem; font-weight: 700; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,.45); transition: bottom .35s ease; z-index: 9999; }
        #toast.show { bottom: 24px; }
        #toast.toast-success { background: #15803d; border: 1px solid #4ade80; }
        #toast.toast-error { background: #b91c1c; border: 1px solid #f87171; }
    </style>
</head>
<body class="flex flex-col md:flex-row">
    <div id="toast" class="toast-success" role="status" aria-live="polite"></div>
    <aside class="w-full md:w-64 sidebar p-6 flex flex-col md:min-h-screen">
        <div class="text-2xl font-bold text-blue-500 mb-8 uppercase text-center italic">Geo<span class="text-white">Frota</span></div>
        <nav class="space-y-4 flex-1">
            <a href="index.html" class="block p-3 text-slate-400 hover:bg-slate-800 rounded-xl transition font-medium">Dashboard</a>
            <a href="operacional.html" class="block p-3 text-slate-400 hover:bg-slate-800 rounded-xl transition font-medium">Operacional</a>
            <a href="usuarios.html" class="block p-3 bg-blue-600 text-white rounded-xl font-bold uppercase text-[10px] tracking-widest">Usuários</a>
            <a id="linkAdministradores" hidden href="administradores.html" class="block p-3 text-slate-400 hover:bg-slate-800 rounded-xl transition font-medium">Administradores</a>
            <button onclick="logout()" class="flex items-center p-3 text-red-500 mt-10 hover:bg-red-500/10 w-full text-left rounded-xl transition font-bold uppercase text-xs"><i class="fas fa-sign-out-alt mr-2"></i> Sair</button>
        </nav>
    </aside>

    <main class="flex-1 p-4 md:p-8">
        <!-- Título e Cadastro -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <h2 class="text-2xl font-black uppercase italic tracking-tighter text-blue-400">Gestão de Efetivo</h2>
            <div class="flex flex-wrap gap-2 w-full md:w-auto">
                <input type="text" id="un" placeholder="Militar" class="flex-1 bg-slate-800 p-3 rounded-xl border border-slate-700 outline-none text-white focus:border-blue-500">
                <input type="text" id="ure" placeholder="RE" class="flex-1 bg-slate-800 p-3 rounded-xl border border-slate-700 outline-none text-white focus:border-blue-500 w-32">
                <select id="usetor" class="bg-slate-800 p-3 rounded-xl border border-slate-700 outline-none text-white focus:border-blue-500"><option>EM</option><option>CTT</option><option>1° CIA</option><option>2° CIA</option><option>3° CIA</option><option>4° CIA</option></select>
                <button onclick="addU()" class="bg-blue-600 px-6 py-3 rounded-xl font-bold hover:bg-blue-500 uppercase text-xs w-full md:w-auto">Adicionar</button>
            </div>
        </div>

        <!-- NOVO: Barra de Busca de Usuários -->
        <div class="relative mb-6">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input type="text" id="inputBuscaUser" oninput="renderizarTabela()" placeholder="Pesquisar por nome ou RE..." class="search-input w-full p-4 pl-12 rounded-2xl text-white font-bold text-sm outline-none">
        </div>

        <div class="bg-slate-800 rounded-2xl overflow-x-auto shadow-2xl">
            <table class="w-full text-left text-sm min-w-[500px]">
                <thead class="bg-slate-900 text-slate-400 text-[10px] uppercase font-black tracking-widest text-center">
                    <tr><th class="p-4 text-center">Identificação do Militar (Nome e RE)</th><th class="p-4 text-center">Subunidade</th><th class="p-4 text-center">Ações</th></tr>
                </thead>
                <tbody id="listaU" class="divide-y divide-slate-900 text-center"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal Exclusão Usuário (Mantido) -->
    <div id="modalExcluirUser" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[200]">
        <div class="card w-full max-w-sm p-8 rounded-3xl text-center border-t-4 border-red-600 shadow-2xl">
            <i class="fas fa-user-minus text-red-500 text-4xl mb-4"></i>
            <h3 class="text-xl font-black text-white mb-2 uppercase tracking-widest">Remover Militar?</h3>
            <p class="text-slate-400 text-xs mb-8 uppercase tracking-widest">Deseja excluir este registro da base?</p>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="fecharExcluirUser()" class="bg-slate-700 p-4 rounded-2xl font-bold uppercase text-xs text-white">Sair</button>
                <button id="btnConfirmarExcluirUser" class="bg-red-600 p-4 rounded-2xl font-bold uppercase text-xs text-white shadow-lg">Remover</button>
            </div>
        </div>
    </div>

    <script>
        const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        let usuariosLocal = []; // Memória auxiliar para a busca rápida
        let adminSetor = null, isSuperadmin = false;
        function showToast(mensagem, tipo = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = mensagem;
            toast.setAttribute('role', tipo === 'error' ? 'alert' : 'status');
            toast.classList.toggle('toast-error', tipo === 'error');
            toast.classList.toggle('toast-success', tipo !== 'error');
            toast.classList.add('show');
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => toast.classList.remove('show'), tipo === 'error' ? 4000 : 3000);
        }

        async function carregar() {
            try {
                const res = await fetch('/api/usuarios?t='+Date.now());
                if(res.status === 401) { window.location.href = 'login.html'; return; }
                const data = await res.json();
                usuariosLocal = data; // Salva a lista completa
                renderizarTabela(); // Renderiza na tela
            } catch(e) { console.error("Erro ao buscar usuários", e); }
        }

        // Função que filtra e desenha a tabela na tela
        function renderizarTabela() {
            const termo = document.getElementById('inputBuscaUser').value.toLowerCase();
            const lista = document.getElementById('listaU');
            
            const filtrados = usuariosLocal.filter(u => 
                u.nome.toLowerCase().includes(termo) ||
                (u.cargo && u.cargo.toLowerCase().includes(termo)) ||
                (u.setor && u.setor.toLowerCase().includes(termo))
            );

            lista.innerHTML = filtrados.map(u => `
                <tr class="hover:bg-slate-900/50 transition border-b border-slate-900">
                    <td class="p-4 uppercase font-bold text-slate-200 text-center">
                        ${escapeHTML(u.nome)} <span class="text-xs text-blue-400 ml-1">(${escapeHTML(u.cargo || '---')})</span>
                    </td>
                    <td class="p-4 text-center text-slate-300">${isSuperadmin ? seletorSetorUsuario(u) : escapeHTML(u.setor || 'Não definida')}</td>
                    <td class="p-4 text-center">
                        ${u.pode_editar ? `<button onclick="abrirConfirmarExcluir(${Number(u.id)})" aria-label="Excluir ${escapeHTML(u.nome)}" class="text-slate-500 hover:text-red-500 transition px-4"><i class="fas fa-trash"></i></button>` : '<span class="text-slate-500 text-sm">Somente leitura</span>'}
                    </td>
                </tr>`).join('');
        }
        function seletorSetorUsuario(u) {
            const setores=['EM','CTT','1° CIA','2° CIA','3° CIA','4° CIA'];
            return `<select aria-label="Subunidade de ${escapeHTML(u.nome)}" onchange="alterarSetor(${Number(u.id)},this.value)" class="bg-slate-900 border border-slate-700 p-2 rounded-lg text-white"><option value="">Não definida</option>${setores.map(s=>`<option value="${s}" ${u.setor===s?'selected':''}>${s}</option>`).join('')}</select>`;
        }

        async function addU() {
            const nome=document.getElementById('un').value, re=document.getElementById('ure').value, setor=document.getElementById('usetor').value;
            if(!nome.trim()) return showToast("Informe o nome do militar.", "error");
            const res = await fetch('/api/usuarios', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({nome, cargo: re, setor})});
            if(res.ok) { document.getElementById('un').value=''; document.getElementById('ure').value=''; showToast('Militar adicionado com sucesso.'); carregar(); }
            else showToast((await res.json()).error || 'Erro ao adicionar o militar.', 'error');
        }
        
        function abrirConfirmarExcluir(id) { document.getElementById('modalExcluirUser').classList.remove('hidden'); document.getElementById('btnConfirmarExcluirUser').onclick = () => deletarUser(id); }
        function fecharExcluirUser() { document.getElementById('modalExcluirUser').classList.add('hidden'); }
        async function deletarUser(id) { const res = await fetch('/api/usuarios/'+id, {method:'DELETE'}); if (!res.ok) return showToast('Erro ao remover o militar.', 'error'); fecharExcluirUser(); showToast('Militar removido com sucesso.'); carregar(); }
        async function alterarSetor(id, setor) { if(!setor) return showToast('Selecione uma subunidade válida.', 'error'); const res=await fetch('/api/usuarios/'+id+'/setor',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({setor})}); const data=await res.json(); if(!res.ok)return showToast(data.error||'Erro ao alterar a subunidade.','error'); showToast('Subunidade atualizada.'); carregar(); }

        async function logout() { await fetch('/api/logout', {method:'POST'}); window.location.href = 'login.html'; }
        
        async function iniciar() {
            const res = await fetch('/api/session');
            if (!res.ok) { location.href='login.html'; return; }
            const sessao = await res.json();
            if (sessao.trocar_senha) { location.href='trocar-senha.html'; return; }
            adminSetor = sessao.setor; isSuperadmin = Boolean(sessao.superadmin);
            document.getElementById('linkAdministradores').hidden = !isSuperadmin;
            const seletor = document.getElementById('usetor');
            if (!isSuperadmin) { seletor.value = adminSetor; seletor.disabled = true; }
            carregar();
        }
        iniciar();
    </script>
</body>
</html>
