<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOFROTA | Portal de Acesso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .bg-portal { background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); }
        .card-access { background: #1e293b; border: 1px solid #334155; transition: 0.4s; cursor: pointer; }
        .card-access:hover { border-color: #3b82f6; transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .brasao { width: 220px; filter: drop-shadow(0 0 15px rgba(0,0,0,0.4)); margin-bottom: 2rem; }
        .text-\[9px\], .text-\[10px\], .text-\[11px\] { font-size: 0.75rem !important; line-height: 1rem !important; }
        .text-xs { font-size: 0.875rem !important; line-height: 1.25rem !important; }
        #toast { position: fixed; left: 50%; bottom: -120px; transform: translateX(-50%); width: min(92vw, 460px); padding: 16px 20px; border-radius: 16px; background: #b91c1c; border: 1px solid #f87171; color: white; font-size: 0.875rem; font-weight: 700; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,.45); transition: bottom .35s ease; z-index: 9999; }
        #toast.show { bottom: 24px; }
    </style>
</head>
<body class="bg-portal min-h-screen flex items-center justify-center p-4">
    <div id="toast" role="alert" aria-live="assertive"></div>
    <div class="w-full max-w-4xl text-center">
        <!-- Link RAW do GitHub para transparência funcionar -->
        <img src="BRASAO%201BPTRAN.png" alt="1° BPTran" class="brasao mx-auto">
        
        <h1 class="text-4xl font-black tracking-tighter uppercase mb-2 italic text-white">Geo<span class="text-blue-500">Frota</span></h1>
        <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.4em] mb-12">1° Batalhão de Polícia de Trânsito</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div onclick="abrirLogin('oper')" class="card-access p-10 rounded-[2.5rem] flex flex-col items-center">
                <i class="fas fa-mobile-alt text-4xl text-blue-500 mb-4"></i>
                <h2 class="text-2xl font-black uppercase italic">Operacional</h2>
                <form id="form-oper" onsubmit="fazerLogin('oper', event)" class="hidden mt-6 w-full animate-pulse">
                    <label for="re-oper" class="sr-only">RE</label>
                    <input type="text" id="re-oper" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required placeholder="RE - 6 números" autocomplete="username" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-center text-white outline-none focus:ring-2 ring-blue-600 font-bold mb-3">
                    <label for="senha-oper" class="sr-only">Senha pessoal</label>
                    <div class="relative mb-4">
                        <input type="password" id="senha-oper" minlength="4" maxlength="8" required placeholder="Senha pessoal" aria-label="Senha pessoal" autocomplete="current-password" class="w-full bg-slate-900 border border-slate-700 p-4 pr-14 rounded-2xl text-center text-white outline-none focus:ring-2 ring-blue-600 font-bold">
                        <button type="button" id="olho-oper" onclick="toggleSenha('oper', event)" aria-label="Mostrar senha pessoal" aria-pressed="false" class="absolute right-2 top-1/2 -translate-y-1/2 w-11 h-11 rounded-xl text-slate-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 p-4 rounded-2xl font-bold uppercase text-xs">Acessar</button>
                    <button type="button" onclick="abrirPrimeiroAcesso(event)" class="mt-4 text-blue-400 hover:text-blue-300 text-xs font-bold uppercase tracking-wider">Primeiro acesso / criar senha</button>
                </form>
                <form id="form-primeiro-oper" onsubmit="criarSenhaOperador(event)" class="hidden mt-6 w-full animate-pulse">
                    <p class="text-slate-400 text-xs mb-4">Disponível somente para RE previamente cadastrado pelo administrador.</p>
                    <label for="re-primeiro-oper" class="sr-only">RE</label>
                    <input type="text" id="re-primeiro-oper" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required placeholder="RE - 6 números" autocomplete="username" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-center text-white outline-none focus:ring-2 ring-blue-600 font-bold mb-3">
                    <label for="senha-primeiro-oper" class="sr-only">Nova senha</label>
                    <input type="password" id="senha-primeiro-oper" minlength="4" maxlength="8" required placeholder="Nova senha - 4 a 8 caracteres" autocomplete="new-password" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-center text-white outline-none focus:ring-2 ring-blue-600 font-bold mb-3">
                    <label for="confirmar-primeiro-oper" class="sr-only">Confirmar senha</label>
                    <input type="password" id="confirmar-primeiro-oper" minlength="4" maxlength="8" required placeholder="Confirme a nova senha" autocomplete="new-password" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-center text-white outline-none focus:ring-2 ring-blue-600 font-bold mb-4">
                    <button type="submit" class="w-full bg-blue-600 p-4 rounded-2xl font-bold uppercase text-xs">Criar senha e entrar</button>
                    <button type="button" onclick="voltarLoginOperador(event)" class="mt-4 text-slate-400 hover:text-white text-xs font-bold uppercase tracking-wider">Voltar</button>
                </form>
            </div>

            <div onclick="abrirLogin('admin')" class="card-access p-10 rounded-[2.5rem] flex flex-col items-center">
                <i class="fas fa-user-shield text-4xl text-amber-500 mb-4"></i>
                <h2 class="text-2xl font-black uppercase italic">Administrativo</h2>
                <form id="form-admin" onsubmit="fazerLogin('admin', event)" class="hidden mt-6 w-full animate-pulse">
                    <label for="usuario-admin" class="sr-only">Acesso administrativo</label>
                    <select id="usuario-admin" aria-label="Selecione o acesso administrativo" required class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-center text-white outline-none focus:ring-2 ring-amber-600 mb-3 font-bold">
                        <option value="" selected disabled>Selecione o acesso</option>
                        <option value="1BPTRAN">ADMINISTRAÇÃO GERAL</option>
                        <option value="EM">EM</option>
                        <option value="CTT">CTT</option>
                        <option value="1CIA">1ª CIA</option>
                        <option value="2CIA">2ª CIA</option>
                        <option value="3CIA">3ª CIA</option>
                        <option value="4CIA">4ª CIA</option>
                    </select>
                    <label for="senha-admin" class="sr-only">Senha do gestor</label>
                    <div class="relative mb-4">
                        <input type="password" id="senha-admin" placeholder="Senha Gestor" aria-label="Senha do gestor" autocomplete="current-password" class="w-full bg-slate-900 border border-slate-700 p-4 pr-14 rounded-2xl text-center text-white outline-none focus:ring-2 ring-amber-600 font-bold">
                        <button type="button" id="olho-admin" onclick="toggleSenha('admin', event)" aria-label="Mostrar senha do gestor" aria-pressed="false" class="absolute right-2 top-1/2 -translate-y-1/2 w-11 h-11 rounded-xl text-slate-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <button type="submit" class="w-full bg-amber-600 p-4 rounded-2xl font-bold uppercase text-xs">Entrar no Painel</button>
                </form>
            </div>
        </div>
    </div>
    <script>
        const CHAVE_ULTIMO_RE = 'geofrota_ultimo_re';
        function salvarUltimoRE(re) {
            if (!/^[0-9]{6}$/.test(re)) return;
            try { localStorage.setItem(CHAVE_ULTIMO_RE, re); } catch (_) {}
        }
        function preencherUltimoRE() {
            try {
                const re = localStorage.getItem(CHAVE_ULTIMO_RE) || '';
                if (/^[0-9]{6}$/.test(re)) {
                    document.getElementById('re-oper').value = re;
                    document.getElementById('re-primeiro-oper').value = re;
                }
            } catch (_) {}
        }
        function abrirLogin(t) { 
            document.getElementById('form-oper').classList.add('hidden'); 
            document.getElementById('form-primeiro-oper').classList.add('hidden');
            document.getElementById('form-admin').classList.add('hidden'); 
            document.getElementById('form-'+t).classList.remove('hidden'); 
            document.getElementById(t === 'admin' ? 'usuario-admin' : 're-oper').focus();
        }
        function toggleSenha(t, event) {
            event.stopPropagation();
            const input = document.getElementById('senha-' + t);
            const botao = document.getElementById('olho-' + t);
            const mostrando = input.type === 'text';
            input.type = mostrando ? 'password' : 'text';
            botao.setAttribute('aria-pressed', String(!mostrando));
            botao.setAttribute('aria-label', (mostrando ? 'Mostrar ' : 'Ocultar ') + (t === 'admin' ? 'senha do gestor' : 'senha pessoal'));
            botao.querySelector('i').className = mostrando ? 'fas fa-eye' : 'fas fa-eye-slash';
            input.focus();
        }
        async function fazerLogin(t, event) {
            if (event) event.preventDefault();
            const senha = document.getElementById('senha-'+t).value;
            const usuario = t === 'admin' ? document.getElementById('usuario-admin').value.trim().toUpperCase() : undefined;
            const re = t === 'oper' ? document.getElementById('re-oper').value.trim() : undefined;
            if (t === 'admin' && !usuario) return showToast('Informe o usuário administrativo.');
            if (t === 'oper' && !/^[0-9]{6}$/.test(re)) return showToast('O RE deve conter exatamente 6 números.');
            const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ senha, tipo: t, usuario, re }) });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('role', t); // Grava a função do usuário (admin ou oper)
                if (t === 'oper') salvarUltimoRE(re);
                window.location.href = data.redirect; 
            } else {
                showToast(data.error || "Senha incorreta. Verifique e tente novamente.");
            }
        }
        function abrirPrimeiroAcesso(event) {
            event.stopPropagation();
            document.getElementById('form-oper').classList.add('hidden');
            document.getElementById('form-primeiro-oper').classList.remove('hidden');
            document.getElementById('re-primeiro-oper').value = document.getElementById('re-oper').value;
            document.getElementById('re-primeiro-oper').focus();
        }
        function voltarLoginOperador(event) {
            event.stopPropagation();
            document.getElementById('form-primeiro-oper').classList.add('hidden');
            document.getElementById('form-oper').classList.remove('hidden');
            document.getElementById('re-oper').value = document.getElementById('re-primeiro-oper').value;
            document.getElementById('re-oper').focus();
        }
        async function criarSenhaOperador(event) {
            event.preventDefault();
            const re = document.getElementById('re-primeiro-oper').value.trim();
            const senha = document.getElementById('senha-primeiro-oper').value;
            const confirmacao = document.getElementById('confirmar-primeiro-oper').value;
            if (!/^[0-9]{6}$/.test(re)) return showToast('O RE deve conter exatamente 6 números.');
            if (senha.length < 4 || senha.length > 8 || /\s/.test(senha)) return showToast('A senha deve ter de 4 a 8 caracteres, sem espaços.');
            if (senha !== confirmacao) return showToast('As senhas não conferem.');
            const res = await fetch('/api/operadores/primeiro-acesso', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ re, senha }) });
            const data = await res.json();
            if (!res.ok) return showToast(data.error || 'Não foi possível criar a senha.');
            localStorage.setItem('role', 'oper');
            salvarUltimoRE(re);
            window.location.href = data.redirect;
        }
        function showToast(mensagem) {
            const toast = document.getElementById('toast');
            toast.textContent = mensagem;
            toast.classList.add('show');
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => toast.classList.remove('show'), 4000);
        }
        document.querySelectorAll('input').forEach(i => i.onclick = (e) => e.stopPropagation());
        document.querySelectorAll('form').forEach(f => f.onclick = (e) => e.stopPropagation());
        preencherUltimoRE();
    </script>
</body>
</html>
