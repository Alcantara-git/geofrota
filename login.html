<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOFROTA | Acesso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .bg-portal { background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); }
        .card-access { background: #1e293b; border: 1px solid #334155; transition: 0.4s; cursor: pointer; }
        .card-access:hover { border-color: #3b82f6; transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .brasao { width: 180px; filter: drop-shadow(0 0 15px rgba(0,0,0,0.5)); }
    </style>
</head>
<body class="bg-portal min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-4xl text-center">
        <img src="https://i.postimg.cc/mD8Zz0yM/brasao-1bptran.png" alt="1° BPTran" class="brasao mx-auto mb-6">
        <h1 class="text-4xl font-black tracking-tighter uppercase mb-2">Geo<span class="text-blue-500">Frota</span></h1>
        <p class="text-slate-500 text-xs font-bold uppercase tracking-[0.3em] mb-12">Sistema de Comando - 1° BPTran</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div onclick="abrirLogin('oper')" class="card-access p-10 rounded-[2.5rem] flex flex-col items-center">
                <div class="bg-blue-500/10 p-6 rounded-full mb-6 text-blue-500"><i class="fas fa-mobile-alt text-4xl"></i></div>
                <h2 class="text-2xl font-black uppercase">Operacional</h2>
                <div id="form-oper" class="hidden mt-6 w-full"><input type="password" id="senha-oper" placeholder="Senha da Unidade" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-center text-white outline-none focus:ring-2 ring-blue-500 mb-4 font-bold"><button onclick="fazerLogin('oper')" class="w-full bg-blue-600 p-4 rounded-2xl font-black uppercase text-xs">Entrar</button></div>
            </div>
            <div onclick="abrirLogin('admin')" class="card-access p-10 rounded-[2.5rem] flex flex-col items-center">
                <div class="bg-amber-500/10 p-6 rounded-full mb-6 text-amber-500"><i class="fas fa-user-shield text-4xl"></i></div>
                <h2 class="text-2xl font-black uppercase">Administrativo</h2>
                <div id="form-admin" class="hidden mt-6 w-full"><input type="password" id="senha-admin" placeholder="Senha Administrativa" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-center text-white outline-none focus:ring-2 ring-amber-500 mb-4 font-bold"><button onclick="fazerLogin('admin')" class="w-full bg-amber-600 p-4 rounded-2xl font-black uppercase text-xs">Acessar Painel</button></div>
            </div>
        </div>
    </div>
    <script>
        function abrirLogin(t) { document.getElementById('form-oper').classList.add('hidden'); document.getElementById('form-admin').classList.add('hidden'); document.getElementById('form-'+t).classList.remove('hidden'); document.getElementById('senha-'+t).focus(); }
        async function fazerLogin(t) {
            const senha = document.getElementById('senha-'+t).value;
            const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ senha, tipo: t }) });
            const data = await res.json();
            if (res.ok) window.location.href = data.redirect;
            else alert("Senha Incorreta!");
        }
        document.querySelectorAll('input').forEach(i => i.onclick = (e) => e.stopPropagation());
    </script>
</body>
</html>
