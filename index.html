<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GEOFROTA | Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; overflow-y: auto; }
        .card { background-color: #1e293b; border: 1px solid #334155; transition: 0.3s; }
        .sidebar { background-color: #0f172a; border-right: 1px solid #1e293b; }
        @media print { .no-print { display: none; } body { background: white; color: black; } }
        
        /* Efeito de Card Ativo */
        .card-active { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); transform: translateY(-2px); }
        .btn-relatorio { background-color: #1e293b; border: 1px solid #334155; transition: 0.3s; }
        .btn-relatorio:hover { background-color: #3b82f6; border-color: #60a5fa; }
        
        /* Estilo da Barra de Busca */
        .search-container { position: relative; }
        .search-input { background-color: #1e293b; border: 1px solid #334155; transition: 0.3s; }
        .search-input:focus { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.2); outline: none; }
    </style>
</head>
<body class="flex flex-col md:flex-row">
    <!-- Sidebar -->
    <aside class="w-full md:w-64 sidebar p-6 flex flex-col md:min-h-screen no-print">
        <div class="text-2xl font-bold text-blue-500 mb-8 tracking-tighter uppercase text-center">Geo<span class="text-white">Frota</span></div>
        <nav class="space-y-2 flex-1">
            <a href="index.html" class="flex items-center p-3 bg-blue-600 text-white rounded-xl font-bold">
                <i class="fas fa-chart-line mr-3"></i> Dashboard
            </a>
            <button onclick="document.getElementById('modalEscolhaRelatorio').classList.remove('hidden')" class="w-full flex items-center p-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition font-medium">
                <i class="fas fa-file-alt mr-3"></i> Relatório
            </button>
            <a href="operacional.html" class="flex items-center p-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition font-medium">
                <i class="fas fa-mobile-alt mr-3"></i> Operacional
            </a>
            <a href="usuarios.html" class="flex items-center p-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition font-medium">
                <i class="fas fa-users mr-3"></i> Usuários
            </a>
            <button onclick="logout()" class="flex items-center p-3 text-red-500 mt-10 hover:bg-red-500/10 w-full text-left rounded-xl transition font-bold uppercase text-[10px]">
                <i class="fas fa-sign-out-alt mr-2"></i> Sair
            </button>
        </nav>
    </aside>

    <main class="flex-1 p-4 md:p-8">
        <header class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4 no-print">
            <div class="flex items-center gap-3">
                <h2 class="text-xl font-bold uppercase tracking-widest text-blue-400">Painel Gestor</h2>
                <div class="h-2 w-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_10px_rgba(34,197,94,0.8)]"></div>
            </div>
            <button onclick="abrirModal()" class="bg-blue-600 px-6 py-3 rounded-xl font-black hover:bg-blue-500 transition shadow-lg text-xs uppercase tracking-widest">+ Nova Viatura</button>
        </header>

        <!-- Cards de Filtro -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 text-center text-[10px] font-black uppercase tracking-widest no-print">
            <div id="card-total" onclick="setFiltroStatus('Todos')" class="card p-4 rounded-xl shadow-lg cursor-pointer hover:bg-slate-800 card-active">
                <p class="text-slate-400">Total</p>
                <h3 id="stat-total" class="text-2xl mt-1 text-white">0</h3>
            </div>
            <div id="card-operante" onclick="setFiltroStatus('Operante')" class="card p-4 rounded-xl border-b-4 border-green-500 shadow-lg cursor-pointer hover:bg-slate-800">
                <p class="text-slate-400">Operantes</p>
                <h3 id="stat-op" class="text-2xl text-green-500 mt-1">0</h3>
            </div>
            <div id="card-oleo" onclick="setFiltroStatus('Troca de Óleo')" class="card p-4 rounded-xl border-b-4 border-amber-500 shadow-lg cursor-pointer hover:bg-slate-800">
                <p class="text-slate-400">Troca de Óleo</p>
                <h3 id="stat-ol" class="text-2xl text-amber-500 mt-1">0</h3>
            </div>
            <div id="card-baixada" onclick="setFiltroStatus('Baixada')" class="card p-4 rounded-xl border-b-4 border-red-600 shadow-lg cursor-pointer hover:bg-slate-800">
                <p class="text-slate-400">Baixadas</p>
                <h3 id="stat-bx" class="text-2xl text-red-600 mt-1">0</h3>
            </div>
        </div>

        <!-- Barra de Pesquisa -->
        <div class="search-container mb-6 no-print">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input type="text" id="inputBusca" oninput="filtrarTabela()" placeholder="Pesquisar por prefixo, placa ou modelo..." class="search-input w-full p-4 pl-12 rounded-2xl text-white font-bold text-sm">
        </div>

        <!-- Tabela -->
        <div class="card rounded-2xl overflow-x-auto shadow-2xl no-print">
            <table class="w-full text-left min-w-[700px]">
                <thead class="bg-slate-800 text-slate-400 text-[10px] uppercase font-black tracking-widest">
                    <tr><th class="p-4">VTR / Placa</th><th class="p-4">KM / Revisão</th><th class="p-4">Último Condutor</th><th class="p-4">Status</th><th class="p-4 text-center">Ações</th></tr>
                </thead>
                <tbody id="corpo" class="divide-y divide-slate-800"></tbody>
            </table>
        </div>
    </main>

    <!-- Modais (Relatório, Filtro, Cadastro) -->
    <div id="modalEscolhaRelatorio" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[130] no-print">
        <div class="card w-full max-w-sm p-8 rounded-3xl text-center">
            <h3 class="text-xl font-black text-blue-400 mb-8 uppercase tracking-widest">Tipo de Relatório</h3>
            <div class="flex flex-col gap-4">
                <button onclick="document.getElementById('modalEscolhaRelatorio').classList.add('hidden'); gerarRelatorio('ultimo')" class="btn-relatorio p-5 rounded-2xl font-bold flex items-center justify-center gap-3 uppercase text-sm">
                    <i class="fas fa-history text-blue-500"></i> Último Acesso
                </button>
                <button onclick="document.getElementById('modalEscolhaRelatorio').classList.add('hidden'); document.getElementById('modalFiltro').classList.remove('hidden')" class="btn-relatorio p-5 rounded-2xl font-bold flex items-center justify-center gap-3 uppercase text-sm">
                    <i class="fas fa-calendar-alt text-amber-500"></i> Filtrar por Período
                </button>
                <button onclick="document.getElementById('modalEscolhaRelatorio').classList.add('hidden')" class="mt-4 text-slate-500 text-xs font-bold uppercase tracking-widest hover:text-white transition">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalFiltro" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[140]">
        <div class="card w-full max-w-sm p-8 rounded-3xl text-center">
            <h3 class="text-xl font-black text-blue-400 mb-6 uppercase">Filtrar Período</h3>
            <div class="space-y-4">
                <div><label class="text-[10px] text-slate-500 uppercase font-bold text-left block ml-1">Início</label><input type="date" id="dataInicio" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl text-white outline-none"></div>
                <div><label class="text-[10px] text-slate-500 uppercase font-bold text-left block ml-1">Fim</label><input type="date" id="dataFim" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl text-white outline-none"></div>
                <div class="flex gap-2 pt-4">
                    <button onclick="document.getElementById('modalFiltro').classList.add('hidden')" class="flex-1 bg-slate-700 p-3 rounded-xl font-bold text-xs uppercase">Voltar</button>
                    <button onclick="gerarRelatorio('periodo')" class="flex-1 bg-blue-600 p-3 rounded-xl font-bold text-xs uppercase">Gerar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modalRelatorio" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[150] overflow-y-auto">
        <div class="card w-full max-w-4xl p-8 rounded-3xl my-auto">
            <div class="flex justify-between items-center mb-6 no-print">
                <h3 class="text-xl font-black text-blue-400 uppercase">Boletim de Alterações</h3>
                <div class="flex gap-2">
                    <button onclick="window.print()" class="bg-blue-600 p-2 px-4 rounded-lg font-bold text-xs uppercase">Imprimir</button>
                    <button onclick="document.getElementById('modalRelatorio').classList.add('hidden')" class="bg-slate-700 p-2 px-4 rounded-lg font-bold text-xs uppercase">Fechar</button>
                </div>
            </div>
            <div id="conteudoRelatorio" class="text-sm"></div>
        </div>
    </div>

    <div id="modalV" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="card w-full max-w-md p-8 rounded-3xl my-auto">
            <h3 id="modalTitulo" class="text-xl font-black mb-6 text-blue-400 text-center uppercase tracking-widest">Viatura</h3>
            <form id="formV" class="space-y-4">
                <input type="hidden" id="editId">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="pref" placeholder="Prefixo" required class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none">
                    <input type="text" id="plac" placeholder="Placa" required class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none">
                </div>
                <input type="text" id="mod" placeholder="Modelo" required class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none">
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="km" placeholder="KM Atual" required class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none">
                    <input type="number" id="kmr" placeholder="Próx. Revisão" required class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none">
                </div>
                <select id="st" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none font-bold">
                    <option value="Operante">Operante</option><option value="Troca de Óleo">Troca de Óleo</option><option value="Baixada">Baixada</option>
                </select>
                <button type="submit" class="w-full bg-blue-600 p-4 rounded-xl font-bold uppercase text-xs">Salvar Alterações</button>
            </form>
        </div>
    </div>

    <script>
        let viaturasLocal = [];
        let statusFiltroAtual = 'Todos';

        async function carregar() {
            try {
                const res = await fetch('/api/viaturas?t=' + Date.now());
                if(res.status === 401) window.location.href = 'login.html';
                viaturasLocal = await res.json();
                
                // Atualiza os números dos cards (sempre baseados no total real)
                document.getElementById('stat-total').innerText = viaturasLocal.length;
                document.getElementById('stat-op').innerText = viaturasLocal.filter(v => v.status === 'Operante').length;
                document.getElementById('stat-ol').innerText = viaturasLocal.filter(v => v.status === 'Troca de Óleo').length;
                document.getElementById('stat-bx').innerText = viaturasLocal.filter(v => v.status === 'Baixada').length;

                filtrarTabela(); // Renderiza a tabela aplicando os filtros atuais
            } catch(e) { console.error("Erro ao carregar dados", e); }
        }

        // Função que combina Busca + Filtro de Card
        function filtrarTabela() {
            const termo = document.getElementById('inputBusca').value.toLowerCase();
            const corpo = document.getElementById('corpo');
            corpo.innerHTML = '';

            const filtradas = viaturasLocal.filter(v => {
                const matchStatus = (statusFiltroAtual === 'Todos' || v.status === statusFiltroAtual);
                const matchBusca = (v.prefixo.toLowerCase().includes(termo) || 
                                    v.placa.toLowerCase().includes(termo) || 
                                    v.modelo.toLowerCase().includes(termo));
                return matchStatus && matchBusca;
            });

            filtradas.forEach(v => {
                let color = v.status==='Operante'?'text-green-500 border-green-500/20 bg-green-500/10':v.status==='Troca de Óleo'?'text-amber-500 border-amber-500/20 bg-amber-500/10':'text-red-500 border-red-500/20 bg-red-500/10';
                corpo.innerHTML += `
                    <tr class="hover:bg-slate-800/40 transition border-b border-slate-800">
                        <td class="p-4 font-bold text-blue-400 uppercase text-sm">${v.prefixo}<br><span class="text-[10px] text-slate-500 font-mono tracking-widest">${v.placa}</span></td>
                        <td class="p-4 text-xs font-mono font-bold"><span class="${v.status==='Troca de Óleo'?'text-amber-500 underline':''}">${Number(v.km).toLocaleString()}</span> <span class="text-slate-600">/ ${Number(v.km_revisao).toLocaleString()}</span></td>
                        <td class="p-4 text-[10px] text-slate-400 uppercase font-bold">${v.ultimo_usuario}</td>
                        <td class="p-4">
                            <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase border ${color}">${v.status}</span>
                            ${v.motivo ? `<div class="text-[9px] text-red-400 mt-1 font-bold italic">"${v.motivo}"</div>` : ''}
                        </td>
                        <td class="p-4 text-center">
                            <button onclick="editar(${v.id})" class="text-slate-500 hover:text-white mx-2 transition"><i class="fas fa-edit"></i></button>
                            <button onclick="deletar(${v.id})" class="text-slate-500 hover:text-red-500 mx-2 transition"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        }

        // Define qual card de status está ativo
        function setFiltroStatus(status) {
            statusFiltroAtual = status;
            
            // Atualiza visual dos cards
            document.querySelectorAll('.card').forEach(c => c.classList.remove('card-active'));
            if(status === 'Todos') document.getElementById('card-total').classList.add('card-active');
            if(status === 'Operante') document.getElementById('card-operante').classList.add('card-active');
            if(status === 'Troca de Óleo') document.getElementById('card-oleo').classList.add('card-active');
            if(status === 'Baixada') document.getElementById('card-baixada').classList.add('card-active');

            filtrarTabela();
        }

        async function logout() { await fetch('/api/logout', {method:'POST'}); window.location.href = 'login.html'; }
        function abrirModal() { document.getElementById('modalTitulo').innerText = "Nova Viatura"; document.getElementById('formV').reset(); document.getElementById('editId').value = ""; document.getElementById('modalV').classList.remove('hidden'); }
        function fecharModal() { document.getElementById('modalV').classList.add('hidden'); }
        function editar(id) {
            const v = viaturasLocal.find(x => x.id === id);
            document.getElementById('modalTitulo').innerText = "Editar Viatura";
            document.getElementById('editId').value = v.id;
            document.getElementById('pref').value = v.prefixo;
            document.getElementById('plac').value = v.placa;
            document.getElementById('mod').value = v.modelo;
            document.getElementById('km').value = v.km;
            document.getElementById('kmr').value = v.km_revisao;
            document.getElementById('st').value = v.status;
            document.getElementById('modalV').classList.remove('hidden');
        }
        document.getElementById('formV').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const dados = { prefixo: document.getElementById('pref').value, placa: document.getElementById('plac').value, modelo: document.getElementById('mod').value, km: document.getElementById('km').value, km_revisao: document.getElementById('kmr').value, status: document.getElementById('st').value, ultimo_usuario: 'Gestor' };
            await fetch(id ? `/api/viaturas/${id}` : '/api/viaturas', { method: id ? 'PUT' : 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(dados) });
            fecharModal(); carregar();
        };
        async function deletar(id) { if(confirm("Remover viatura?")) { await fetch(`/api/viaturas/${id}`, {method:'DELETE'}); carregar(); } }

        // Scripts do Relatório
        async function gerarRelatorio(tipo) {
            let url = '/api/relatorio-ultimo';
            if (tipo === 'periodo') {
                const inicio = document.getElementById('dataInicio').value;
                const fim = document.getElementById('dataFim').value;
                if (!inicio || !fim) return alert("Selecione as datas!");
                url = `/api/relatorio-periodo?inicio=${inicio}&fim=${fim}`;
                document.getElementById('modalFiltro').classList.add('hidden');
            }
            const res = await fetch(url);
            const data = await res.json();
            const div = document.getElementById('conteudoRelatorio');
            if(data.length === 0) {
                div.innerHTML = `<p class="text-center p-10 text-slate-500 font-bold uppercase tracking-widest">Nenhuma alteração registrada.</p>`;
            } else {
                let html = `<div class="text-center mb-8"><h2 class="text-2xl font-black uppercase">Relatório GEOFROTA</h2><p class="text-xs text-slate-500 font-bold uppercase">Rastro Histórico de Alterações</p></div><table class="w-full border-collapse border border-slate-700 text-left"><thead><tr class="bg-slate-800 text-[10px] uppercase"><th class="border border-slate-700 p-2">Data/Hora</th><th class="border border-slate-700 p-2">VTR</th><th class="border border-slate-700 p-2 text-center">KM Ant.</th><th class="border border-slate-700 p-2 text-center">KM Novo</th><th class="border border-slate-700 p-2">Status / Motivo</th><th class="border border-slate-700 p-2">Responsável</th></tr></thead><tbody>`;
                data.forEach(h => { html += `<tr class="text-[11px] border border-slate-700"><td class="border border-slate-700 p-2 font-mono">${h.hora}</td><td class="border border-slate-700 p-2 font-bold">${h.prefixo}</td><td class="border border-slate-700 p-2 text-center">${h.km_anterior.toLocaleString()}</td><td class="border border-slate-700 p-2 text-center font-bold">${h.km_novo.toLocaleString()}</td><td class="border border-slate-700 p-2 uppercase font-bold">${h.status} ${h.motivo ? `(${h.motivo})` : ''}</td><td class="border border-slate-700 p-2 uppercase">${h.usuario}</td></tr>`; });
                html += `</tbody></table>`;
                div.innerHTML = html;
            }
            document.getElementById('modalRelatorio').classList.remove('hidden');
        }

        setInterval(carregar, 5000); 
        carregar();
    </script>
</body>
</html>
