<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GEOFROTA | Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; overflow-y: auto; }
        .card { background-color: #1e293b; border: 1px solid #334155; transition: 0.3s; }
        .sidebar { background-color: #0f172a; border-right: 1px solid #1e293b; }
        .card-active { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); transform: translateY(-2px); }
        .btn-setor { background: #1e293b; border: 1px solid #334155; color: #94a3b8; transition: 0.2s; white-space: nowrap; }
        .btn-setor.active { background: #3b82f6; color: white; border-color: #60a5fa; font-weight: 800; }
        .btn-art { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid #334155; transition: 0.4s; }
        .btn-art:hover { transform: scale(1.02); border-color: #3b82f6; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        @media print { .no-print { display: none; } body { background: white; color: black; } }
    </style>
</head>
<body class="flex flex-col md:flex-row">
    <!-- Sidebar -->
    <aside class="w-full md:w-64 sidebar p-6 flex flex-col md:min-h-screen no-print">
        <div class="text-2xl font-bold text-blue-500 mb-8 uppercase text-center italic tracking-tighter">Geo<span class="text-white">Frota</span></div>
        <nav class="space-y-2 flex-1">
            <a href="index.html" class="flex items-center p-3 bg-blue-600 text-white rounded-xl font-bold"><i class="fas fa-chart-line mr-3"></i> Dashboard</a>
            <button onclick="document.getElementById('modalEscolhaRelatorio').classList.remove('hidden')" class="w-full flex items-center p-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition font-medium"><i class="fas fa-file-alt mr-3"></i> Relatório</button>
            <a href="operacional.html" class="flex items-center p-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition font-medium"><i class="fas fa-mobile-alt mr-3"></i> Operacional</a>
            <a href="usuarios.html" class="flex items-center p-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition font-medium"><i class="fas fa-users mr-3"></i> Usuários</a>
            <button onclick="logout()" class="flex items-center p-3 text-red-500 mt-10 hover:bg-red-500/10 w-full text-left rounded-xl transition font-bold uppercase text-[10px]"><i class="fas fa-sign-out-alt mr-2"></i> Sair</button>
        </nav>
    </aside>

    <main class="flex-1 p-4 md:p-8">
        <header class="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4 no-print">
            <div class="flex items-center gap-3"><h2 class="text-xl font-bold uppercase tracking-widest text-blue-400">Painel Gestor</h2><div class="h-2 w-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_10px_rgba(34,197,94,0.8)]"></div></div>
            <div class="flex overflow-x-auto gap-2 py-2 no-scrollbar px-2">
                <button onclick="setSetor('Todos')" id="btn-Todos" class="btn-setor active px-4 py-2 rounded-lg text-[10px] font-black uppercase">1° BPTRAN</button>
                <button onclick="setSetor('EM')" id="btn-EM" class="btn-setor px-4 py-2 rounded-lg text-[10px] uppercase">EM</button>
                <button onclick="setSetor('CTT')" id="btn-CTT" class="btn-setor px-4 py-2 rounded-lg text-[10px] uppercase">CTT</button>
                <button onclick="setSetor('1° CIA')" id="btn-1CIA" class="btn-setor px-4 py-2 rounded-lg text-[10px] uppercase">1° CIA</button>
                <button onclick="setSetor('2° CIA')" id="btn-2CIA" class="btn-setor px-4 py-2 rounded-lg text-[10px] uppercase">2° CIA</button>
                <button onclick="setSetor('3° CIA')" id="btn-3CIA" class="btn-setor px-4 py-2 rounded-lg text-[10px] uppercase">3° CIA</button>
                <button onclick="setSetor('4° CIA')" id="btn-4CIA" class="btn-setor px-4 py-2 rounded-lg text-[10px] uppercase">4° CIA</button>
            </div>
            <button onclick="abrirModal()" class="bg-blue-600 px-6 py-3 rounded-xl font-black hover:bg-blue-500 transition shadow-lg text-xs uppercase">+ Nova Viatura</button>
        </header>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 text-center text-[10px] font-black uppercase tracking-widest no-print">
            <div id="card-total" onclick="setFiltroStatus('Todos')" class="card p-4 rounded-xl shadow-lg cursor-pointer card-active"><p class="text-slate-400">Total</p><h3 id="stat-total" class="text-2xl mt-1">0</h3></div>
            <div id="card-operante" onclick="setFiltroStatus('Operante')" class="card p-4 rounded-xl border-b-4 border-green-500 cursor-pointer"><p class="text-slate-400">Operantes</p><h3 id="stat-op" class="text-2xl text-green-500 mt-1">0</h3></div>
            <div id="card-oleo" onclick="setFiltroStatus('Troca de Óleo')" class="card p-4 rounded-xl border-b-4 border-amber-500 cursor-pointer"><p class="text-slate-400">Troca Óleo</p><h3 id="stat-ol" class="text-2xl text-amber-500 mt-1">0</h3></div>
            <div id="card-baixada" onclick="setFiltroStatus('Baixada')" class="card p-4 rounded-xl border-b-4 border-red-600 cursor-pointer"><p class="text-slate-400">Baixadas</p><h3 id="stat-bx" class="text-2xl text-red-600 mt-1">0</h3></div>
        </div>

        <div class="card rounded-2xl overflow-x-auto shadow-2xl no-print">
            <table class="w-full text-left min-w-[700px]">
                <thead class="bg-slate-800 text-slate-400 text-[10px] uppercase font-black tracking-widest">
                    <tr><th class="p-4">Subunidade</th><th class="p-4">VTR / Placa</th><th class="p-4">KM / Revisão</th><th class="p-4">Último Condutor</th><th class="p-4">Status / Motivo</th><th class="p-4 text-center">Ações</th></tr>
                </thead>
                <tbody id="corpo" class="divide-y divide-slate-800"></tbody>
            </table>
        </div>
    </main>

    <!-- MODAL RELATÓRIO ARTÍSTICO -->
    <div id="modalEscolhaRelatorio" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[130] no-print">
        <div class="card w-full max-w-md p-8 rounded-[2.5rem] text-center border-t-4 border-blue-500">
            <h3 class="text-xl font-black mb-2 uppercase">Gerar Relatório</h3>
            <p id="labelSetorRelatorio" class="text-[10px] text-blue-400 font-bold mb-8 uppercase tracking-widest">Filtro: 1° BPTRAN</p>
            <div class="grid grid-cols-1 gap-4">
                <button onclick="gerarRelatorio('ultimo')" class="btn-art p-6 rounded-3xl flex flex-col items-center">
                    <i class="fas fa-history text-blue-500"></i><span class="font-black text-sm uppercase">Último Acesso</span>
                </button>
                <button onclick="document.getElementById('modalEscolhaRelatorio').classList.add('hidden'); document.getElementById('modalFiltro').classList.remove('hidden')" class="btn-art p-6 rounded-3xl flex flex-col items-center">
                    <i class="fas fa-calendar-alt text-amber-500"></i><span class="font-black text-sm uppercase">Filtrar Período</span>
                </button>
                <button onclick="document.getElementById('modalEscolhaRelatorio').classList.add('hidden')" class="mt-4 text-slate-500 text-xs font-bold uppercase">Voltar</button>
            </div>
        </div>
    </div>

    <!-- Modal Calendário -->
    <div id="modalFiltro" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[140] p-4">
        <div class="card p-8 rounded-3xl w-full max-w-sm text-center">
            <h3 class="text-blue-400 font-black mb-6">DEFINIR PERÍODO</h3>
            <input type="date" id="dataInicio" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mb-2 text-white outline-none">
            <input type="date" id="dataFim" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mb-6 text-white outline-none">
            <button onclick="gerarRelatorio('periodo')" class="w-full bg-blue-600 p-3 rounded-xl font-bold mb-2">GERAR RELATÓRIO</button>
            <button onclick="document.getElementById('modalFiltro').classList.add('hidden'); document.getElementById('modalEscolhaRelatorio').classList.remove('hidden')" class="text-slate-500 text-xs uppercase font-bold">Voltar</button>
        </div>
    </div>

    <div id="modalRelatorio" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[150] p-4 overflow-y-auto">
        <div class="card w-full max-w-5xl p-8 rounded-3xl my-auto text-sm">
            <div class="flex justify-between items-center mb-6 no-print">
                <h3 class="font-black uppercase text-blue-400">Boletim GEOFROTA</h3>
                <div class="flex gap-2">
                    <button onclick="window.print()" class="bg-blue-600 p-2 px-6 rounded-lg font-bold">Imprimir</button>
                    <button onclick="document.getElementById('modalRelatorio').classList.add('hidden')" class="bg-slate-700 p-2 px-6 rounded-lg font-bold">Fechar</button>
                </div>
            </div>
            <div id="conteudoRelatorio"></div>
        </div>
    </div>

    <!-- Modal VTR -->
    <div id="modalV" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="card w-full max-w-md p-8 rounded-3xl my-auto">
            <h3 id="modalTitulo" class="text-xl font-black mb-6 text-blue-400 text-center uppercase">Viatura</h3>
            <form id="formV" class="space-y-4">
                <input type="hidden" id="editId">
                <select id="setor" class="bg-slate-900 border border-slate-700 p-3 rounded-xl w-full text-white font-bold">
                    <option value="EM">EM</option><option value="CTT">CTT</option><option value="1° CIA">1° CIA</option><option value="2° CIA">2° CIA</option><option value="3° CIA">3° CIA</option><option value="4° CIA">4° CIA</option>
                </select>
                <div class="grid grid-cols-2 gap-4"><input type="text" id="pref" placeholder="Prefixo" required class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none"><input type="text" id="plac" placeholder="Placa" required class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none"></div>
                <input type="text" id="mod" placeholder="Modelo" required class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none">
                <div class="grid grid-cols-2 gap-4"><input type="number" id="km" placeholder="KM Atual" required class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none"><input type="number" id="kmr" placeholder="KM Revisão" required class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none"></div>
                <select id="st" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white font-bold"><option value="Operante">Operante</option><option value="Troca de Óleo">Troca de Óleo</option><option value="Baixada">Baixada</option></select>
                <button type="submit" class="w-full bg-blue-600 p-4 rounded-xl font-bold uppercase">Salvar</button>
            </form>
        </div>
    </div>

    <script>
        let viaturasLocal = [];
        let statusFiltro = 'Todos';
        let setorFiltro = 'Todos';

        async function carregar() {
            try {
                const res = await fetch('/api/viaturas?t=' + Date.now());
                if(res.status === 401) window.location.href = 'login.html';
                viaturasLocal = await res.json();
                renderizarTabela();
            } catch(e) {}
        }

        function renderizarTabela() {
            const corpo = document.getElementById('corpo');
            corpo.innerHTML = '';
            const filtradas = viaturasLocal.filter(v => (setorFiltro === 'Todos' || v.setor === setorFiltro) && (statusFiltro === 'Todos' || v.status === statusFiltro));
            const baseCards = setorFiltro === 'Todos' ? viaturasLocal : viaturasLocal.filter(v => v.setor === setorFiltro);
            document.getElementById('stat-total').innerText = baseCards.length;
            document.getElementById('stat-op').innerText = baseCards.filter(v => v.status === 'Operante').length;
            document.getElementById('stat-ol').innerText = baseCards.filter(v => v.status === 'Troca de Óleo').length;
            document.getElementById('stat-bx').innerText = baseCards.filter(v => v.status === 'Baixada').length;

            filtradas.forEach(v => {
                let color = v.status==='Operante'?'text-green-500 border-green-500/20 bg-green-500/10':v.status==='Troca de Óleo'?'text-amber-500 border-amber-500/20 bg-amber-500/10':'text-red-500 border-red-500/20 bg-red-500/10';
                corpo.innerHTML += `<tr class="hover:bg-slate-800/40 transition"><td class="p-4 font-black text-[10px] text-slate-500 uppercase">${v.setor}</td><td class="p-4 font-bold text-blue-400 uppercase text-sm">${v.prefixo}<br><span class="text-[10px] text-slate-500">${v.placa}</span></td><td class="p-4 text-xs font-mono font-bold">${Number(v.km).toLocaleString()} / ${Number(v.km_revisao).toLocaleString()}</td><td class="p-4 text-[10px] text-slate-400 uppercase font-bold">${v.ultimo_usuario}</td><td class="p-4"><span class="px-3 py-1 rounded-full text-[9px] font-black uppercase border ${color}">${v.status}</span>${v.motivo ? `<div class="text-[9px] text-red-400 mt-1 italic">"${v.motivo}"</div>` : ''}</td><td class="p-4 text-center"><button onclick="editar(${v.id})" class="text-slate-500 mr-2 transition hover:text-white"><i class="fas fa-edit"></i></button><button onclick="deletar(${v.id})" class="text-slate-500 transition hover:text-red-500"><i class="fas fa-trash"></i></button></td></tr>`;
            });
            document.getElementById('labelSetorRelatorio').innerText = 'Filtro: ' + (setorFiltro === 'Todos' ? '1° BPTRAN' : setorFiltro);
        }

        function setSetor(s) {
            setorFiltro = s;
            document.querySelectorAll('.btn-setor').forEach(b => b.classList.remove('active'));
            const idBtn = s === '1° CIA' ? 'btn-1CIA' : s === '2° CIA' ? 'btn-2CIA' : s === '3° CIA' ? 'btn-3CIA' : s === '4° CIA' ? 'btn-4CIA' : 'btn-' + s;
            document.getElementById(idBtn).classList.add('active');
            renderizarTabela();
        }

        function setFiltroStatus(s) {
            statusFiltro = s;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('card-active'));
            const idCard = s === 'Todos' ? 'card-total' : s === 'Operante' ? 'card-operante' : s === 'Troca de Óleo' ? 'card-oleo' : 'card-baixada';
            document.getElementById(idCard).classList.add('card-active');
            renderizarTabela();
        }

        async function gerarRelatorio(tipo) {
            document.getElementById('modalEscolhaRelatorio').classList.add('hidden');
            let url = `/api/relatorio-ultimo?setor=${setorFiltro}`;
            if (tipo === 'periodo') {
                const inicio = document.getElementById('dataInicio').value;
                const fim = document.getElementById('dataFim').value;
                if (!inicio || !fim) return alert("Selecione as datas!");
                url = `/api/relatorio-periodo?inicio=${inicio}&fim=${fim}&setor=${setorFiltro}`;
                document.getElementById('modalFiltro').classList.add('hidden');
            }
            const res = await fetch(url);
            const data = await res.json();
            const div = document.getElementById('conteudoRelatorio');
            const unit = setorFiltro === 'Todos' ? '1° BPTRAN (GERAL)' : setorFiltro;

            if(data.length === 0) {
                div.innerHTML = `<p class="text-center p-10 text-slate-500 uppercase font-black">Nenhuma alteração registrada para ${unit}.</p>`;
            } else {
                let html = `<div class="text-center mb-8"><h2 class="text-2xl font-black uppercase tracking-tighter">Relatório GEOFROTA</h2><p class="text-xs text-blue-500 font-bold uppercase">${unit}</p></div><table class="w-full border-collapse border border-slate-700 text-left"><thead><tr class="bg-slate-800 text-[10px] uppercase text-white"><th class="border border-slate-700 p-2">Data/Hora</th><th class="border border-slate-700 p-2">VTR</th><th class="border border-slate-700 p-2 text-center">KM Ant.</th><th class="border border-slate-700 p-2 text-center">KM Novo</th><th class="border border-slate-700 p-2">Status / Motivo</th><th class="border border-slate-700 p-2">Responsável</th></tr></thead><tbody>`;
                data.forEach(h => { html += `<tr class="text-[11px] border border-slate-700"><td class="border border-slate-700 p-2 font-mono">${h.hora}</td><td class="border border-slate-700 p-2 font-bold">${h.prefixo}</td><td class="border border-slate-700 p-2 text-center">${h.km_anterior.toLocaleString()}</td><td class="border border-slate-700 p-2 text-center font-bold">${h.km_novo.toLocaleString()}</td><td class="border border-slate-700 p-2 uppercase font-bold">${h.status} ${h.motivo ? `(${h.motivo})` : ''}</td><td class="border border-slate-700 p-2 uppercase">${h.usuario}</td></tr>`; });
                html += `</tbody></table>`;
                div.innerHTML = html;
            }
            document.getElementById('modalRelatorio').classList.remove('hidden');
        }

        function abrirModal() { 
            document.getElementById('modalTitulo').innerText = "Nova Viatura"; 
            document.getElementById('formV').reset(); 
            document.getElementById('editId').value = ""; 
            // INTELIGÊNCIA: Se estiver em uma CIA, já marca ela no formulário
            if(setorFiltro !== 'Todos') document.getElementById('setor').value = setorFiltro;
            document.getElementById('modalV').classList.remove('hidden'); 
        }
        function fecharModal() { document.getElementById('modalV').classList.add('hidden'); }
        function editar(id) {
            const v = viaturasLocal.find(x => x.id === id);
            document.getElementById('modalTitulo').innerText = "Editar Viatura";
            document.getElementById('editId').value = v.id;
            document.getElementById('pref').value = v.prefixo; document.getElementById('plac').value = v.placa; document.getElementById('mod').value = v.modelo; document.getElementById('km').value = v.km; document.getElementById('kmr').value = v.km_revisao; document.getElementById('st').value = v.status; document.getElementById('setor').value = v.setor;
            document.getElementById('modalV').classList.remove('hidden');
        }
        document.getElementById('formV').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const dados = { prefixo: document.getElementById('pref').value, placa: document.getElementById('plac').value, modelo: document.getElementById('mod').value, km: document.getElementById('km').value, km_revisao: document.getElementById('kmr').value, status: document.getElementById('st').value, setor: document.getElementById('setor').value, ultimo_usuario: 'Gestor' };
            await fetch(id ? `/api/viaturas/${id}` : '/api/viaturas', { method: id ? 'PUT' : 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(dados) });
            fecharModal(); carregar();
        };
        async function deletar(id) { if(confirm("Excluir?")) { await fetch(`/api/viaturas/${id}`, {method:'DELETE'}); carregar(); } }
        async function logout() { await fetch('/api/logout', {method:'POST'}); window.location.href = 'login.html'; }
        setInterval(carregar, 5000); carregar();
    </script>
</body>
</html>
