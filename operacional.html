<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOFROTA | Operacional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        /* Estilo para simular um seletor */
        .custom-select { background-color: #0f172a; border: 1px solid #334155; padding: 1rem; border-radius: 1rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .modal-overlay { background-color: rgba(15, 23, 42, 0.98); backdrop-filter: blur(10px); }
        .list-item { padding: 1rem; border-bottom: 1px solid #1e293b; cursor: pointer; transition: 0.2s; }
        .list-item:hover { background-color: #1e293b; color: #3b82f6; }
    </style>
</head>
<body class="p-4 items-center justify-center">

    <div class="w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-black text-blue-500 uppercase tracking-tighter">Geo<span class="text-white">Frota</span></h1>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest mt-1">Lançamento de Quilometragem</p>
        </div>

        <div class="bg-slate-800 p-6 rounded-[2.5rem] shadow-2xl border border-slate-700">
            <form id="formKM" class="space-y-5">
                
                <!-- Gatilho do Responsável -->
                <div>
                    <label class="text-[10px] font-black text-slate-500 ml-1 uppercase">Responsável</label>
                    <div id="triggerUser" onclick="abrirBusca('usuarios')" class="custom-select text-white">
                        <span id="labelUser">-- Selecione seu Nome --</span>
                        <i class="fas fa-chevron-down text-slate-500 text-xs"></i>
                    </div>
                </div>

                <!-- Gatilho da Viatura -->
                <div>
                    <label class="text-[10px] font-black text-slate-500 ml-1 uppercase">Viatura</label>
                    <div id="triggerVtr" onclick="abrirBusca('viaturas')" class="custom-select text-white">
                        <span id="labelVtr">-- Selecione a VTR --</span>
                        <i class="fas fa-chevron-down text-slate-500 text-xs"></i>
                    </div>
                </div>

                <!-- Painel de Baixa -->
                <div id="painelBaixa" class="hidden bg-red-900/10 border border-red-900/30 p-4 rounded-2xl">
                    <label class="text-[10px] font-black text-red-500 ml-1 uppercase">Relatar Problema / Baixar VTR</label>
                    <textarea id="motivo" placeholder="Descreva o defeito aqui..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white text-sm outline-none focus:ring-1 ring-red-500 h-20 mt-2"></textarea>
                </div>

                <!-- KM Info -->
                <div id="info" class="hidden bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center">
                    <p class="text-[10px] text-slate-500 uppercase font-black">KM Atual Registrado</p>
                    <p id="kmD" class="text-3xl font-mono font-bold text-blue-400">0</p>
                </div>

                <div>
                    <label class="text-[10px] font-black text-slate-500 ml-1 uppercase">Novo Hodômetro</label>
                    <input type="number" id="nKM" required placeholder="0" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-3xl text-center font-mono text-white outline-none focus:ring-2 ring-blue-600">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button type="button" id="btnBaixa" onclick="toggleBaixa()" class="bg-slate-700 p-4 rounded-2xl font-black text-[10px] uppercase hover:bg-red-900 transition">❌ Baixar VTR</button>
                    <button type="submit" class="bg-blue-600 p-4 rounded-2xl font-black text-[10px] uppercase hover:bg-blue-500 shadow-lg">✅ Atualizar KM</button>
                </div>
            </form>
        </div>
        <a href="index.html" class="block text-center mt-8 text-slate-600 uppercase text-[10px] font-black hover:text-white transition tracking-widest italic">Acesso Gestão</a>
    </div>

    <!-- MODAL DE BUSCA (Aparece ao clicar nos campos acima) -->
    <div id="modalBusca" class="hidden fixed inset-0 z-[100] modal-overlay p-4 flex flex-col">
        <div class="flex justify-between items-center mb-4">
            <h2 id="modalBuscaTitulo" class="text-blue-400 font-black uppercase text-sm tracking-widest">Pesquisar</h2>
            <button onclick="fecharBusca()" class="text-white text-2xl">&times;</button>
        </div>
        <input type="text" id="inputBusca" placeholder="Comece a digitar..." class="w-full bg-slate-800 border border-blue-500 p-4 rounded-2xl text-xl outline-none mb-4 font-bold text-white shadow-2xl shadow-blue-500/10">
        
        <div id="listaResultados" class="flex-1 overflow-y-auto rounded-2xl bg-slate-900/50">
            <!-- Itens filtrados aparecem aqui -->
        </div>
    </div>

    <script>
        let viaturas = [];
        let usuarios = [];
        let estaBaixando = false;
        let tipoBusca = ''; // 'usuarios' ou 'viaturas'
        let selecionadoVtrId = null;
        let selecionadoUserNome = null;

        function toggleBaixa() {
            estaBaixando = !estaBaixando;
            const painel = document.getElementById('painelBaixa');
            const btn = document.getElementById('btnBaixa');
            if(estaBaixando) {
                painel.classList.remove('hidden');
                btn.innerText = "🚩 CANCELAR BAIXA";
                btn.classList.add('bg-red-600');
            } else {
                painel.classList.add('hidden');
                btn.innerText = "❌ BAIXAR VIATURA";
                btn.classList.remove('bg-red-600');
                document.getElementById('motivo').value = '';
            }
        }

        // FUNÇÃO PARA ABRIR O MODAL DE BUSCA
        function abrirBusca(tipo) {
            tipoBusca = tipo;
            const modal = document.getElementById('modalBusca');
            const titulo = document.getElementById('modalBuscaTitulo');
            const input = document.getElementById('inputBusca');
            
            titulo.innerText = tipo === 'usuarios' ? 'Selecionar Responsável' : 'Selecionar Viatura';
            input.value = '';
            modal.classList.remove('hidden');
            input.focus();
            renderizarLista('');
        }

        function fecharBusca() {
            document.getElementById('modalBusca').classList.add('hidden');
        }

        // RENDERIZA A LISTA COM FILTRO
        function renderizarLista(termo) {
            const lista = document.getElementById('listaResultados');
            lista.innerHTML = '';
            termo = termo.toLowerCase();

            if (tipoBusca === 'usuarios') {
                const filtrados = usuarios.filter(u => u.nome.toLowerCase().includes(termo));
                filtrados.forEach(u => {
                    lista.innerHTML += `<div class="list-item" onclick="selecionarItem('${u.nome}', '${u.nome}')">${u.nome} <span class="text-[10px] text-slate-500">(${u.cargo})</span></div>`;
                });
            } else {
                const filtrados = viaturas.filter(v => v.prefixo.toLowerCase().includes(termo) || v.placa.toLowerCase().includes(termo));
                filtrados.forEach(v => {
                    lista.innerHTML += `<div class="list-item" onclick="selecionarItem(${v.id}, '${v.prefixo} (${v.placa})')">
                        <div class="font-bold">${v.prefixo}</div>
                        <div class="text-xs text-slate-500">${v.placa} - ${v.modelo}</div>
                    </div>`;
                });
            }
        }

        // SELECIONA O ITEM E FECHA O MODAL
        function selecionarItem(id, display) {
            if (tipoBusca === 'usuarios') {
                selecionadoUserNome = id;
                document.getElementById('labelUser').innerText = display;
                document.getElementById('labelUser').classList.add('text-blue-400');
            } else {
                selecionadoVtrId = id;
                document.getElementById('labelVtr').innerText = display;
                document.getElementById('labelVtr').classList.add('text-blue-400');
                
                const v = viaturas.find(x => x.id == id);
                document.getElementById('info').classList.remove('hidden');
                document.getElementById('kmD').innerText = Number(v.km).toLocaleString();
                document.getElementById('nKM').value = v.km;
            }
            fecharBusca();
        }

        // ESCUTA O DIGITADO NA BUSCA
        document.getElementById('inputBusca').oninput = (e) => renderizarLista(e.target.value);

        async function sincronizar() {
            try {
                const [rv, ru] = await Promise.all([fetch('/api/viaturas?t='+Date.now()), fetch('/api/usuarios?t='+Date.now())]);
                const novasViaturas = await rv.json();
                const novosUsuarios = await ru.json();

                // Atualiza dados silenciosamente
                viaturas = novasViaturas;
                usuarios = novosUsuarios;

                // Se houver uma VTR selecionada, mantém o KM atualizado em tempo real na tela
                if (selecionadoVtrId) {
                    const v = viaturas.find(x => x.id == selecionadoVtrId);
                    if (v) document.getElementById('kmD').innerText = Number(v.km).toLocaleString();
                }
            } catch (e) { console.error(e); }
        }

        document.getElementById('formKM').onsubmit = async (e) => {
            e.preventDefault();
            if(!selecionadoUserNome || !selecionadoVtrId) return alert("Selecione o Responsável e a Viatura!");

            const nKM = parseInt(document.getElementById('nKM').value);
            const motivo = document.getElementById('motivo').value;
            const v = viaturas.find(x => x.id == selecionadoVtrId);
            
            if(nKM < v.km) return alert("ERRO: O KM digitado é menor que o atual!");
            if(estaBaixando && !motivo) return alert("Informe o motivo da baixa!");

            const dados = { ...v, km: nKM, ultimo_usuario: selecionadoUserNome, status: estaBaixando ? 'Baixada' : v.status, motivo: estaBaixando ? motivo : (v.status === 'Baixada' ? v.motivo : '') };

            const res = await fetch(`/api/viaturas/${selecionadoVtrId}`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(dados) });
            if(res.ok) { alert("✅ Dados Enviados!"); location.reload(); }
        };

        setInterval(sincronizar, 5000);
        sincronizar();
    </script>
</body>
</html>
